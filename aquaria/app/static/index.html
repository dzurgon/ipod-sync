<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquaria Music Manager</title>
<style>
  :root{
    --backdrop: linear-gradient(160deg,#012a36 0%,#034e5c 38%,#0a7c86 72%,#3fd0c9 100%);
    --glass: rgba(255,255,255,.08);
    --glass-strong: rgba(255,255,255,.14);
    --line: rgba(180,255,247,.16);
    --aqua: #6ff2e4;
    --aqua-dim: #7fd8cf;
    --ink: #eafffb;
    --ink-dim: #9fc4c0;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--backdrop) fixed;
  }
  a{color:var(--aqua)}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 16px 150px}
  h1{font-weight:700;letter-spacing:.3px;margin:0 0 2px;font-size:26px;
     text-shadow:0 2px 18px rgba(0,0,0,.35)}
  h2{margin:0 0 4px;font-size:20px}
  .sub{color:var(--ink-dim);font-size:13px;margin-bottom:22px}

  /* Users row */
  .users{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .user{background:var(--glass);border:1px solid var(--line);border-radius:16px;
        padding:12px 16px;min-width:150px;backdrop-filter:blur(8px)}
  .user.active{border-color:var(--aqua);box-shadow:0 0 0 1px var(--aqua),0 8px 30px rgba(111,242,228,.18)}
  .user .name{font-weight:600}
  .user .ipods{font-size:11px;color:var(--ink-dim);margin-top:3px}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;
       border:1px solid var(--line);background:var(--glass);color:var(--ink-dim);transition:.15s}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--aqua);color:#012129;font-weight:600;border-color:var(--aqua)}

  .panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;
         padding:20px;backdrop-filter:blur(10px);min-height:220px}

  /* Library toggle */
  .seg{display:inline-flex;background:rgba(0,0,0,.22);border-radius:14px;padding:4px;margin-bottom:18px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;color:var(--ink-dim);padding:7px 14px;border-radius:11px;
              cursor:pointer;font-size:13px;transition:.15s}
  .seg button.on{background:var(--aqua);color:#012129;font-weight:600}

  .genre-h{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--aqua-dim);
           margin:22px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}

  .tile{cursor:pointer;transition:.16s;min-width:0}
  .tile:hover{transform:translateY(-3px)}
  .thumb{width:100%;aspect-ratio:1;border-radius:14px;background:
         linear-gradient(145deg,#0b5b63,#0a3b45);display:flex;align-items:center;justify-content:center;
         font-size:34px;border:1px solid var(--line);overflow:hidden}
  .thumb.round{border-radius:50%}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .t-name{margin-top:8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-meta{font-size:11px;color:var(--ink-dim)}
  .t-genre{font-size:10px;color:var(--aqua-dim);letter-spacing:.4px}

  /* Rows (all-albums list, tracklists, playlists) */
  .list .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;
             border-bottom:1px solid var(--line);border-radius:8px}
  .list .row.click{cursor:pointer}
  .list .row:hover{background:var(--glass-strong)}
  .list .row .r-genre{font-size:11px;color:var(--aqua-dim);white-space:nowrap}
  .row .main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .num{color:var(--ink-dim);width:28px;font-variant-numeric:tabular-nums;font-size:13px}
  /* Album tracklist: 5/8 width so the row actions stay near the title; play appears on hover */
  .list.tracks{max-width:62.5%}
  .row .hoverplay{opacity:0;transition:opacity .12s;flex-shrink:0}
  .row:hover .hoverplay,.row.playing .hoverplay,.row .hoverplay:focus-visible{opacity:1}
  @media (hover:none){ .row .hoverplay{opacity:1} }
  @media (max-width:900px){ .list.tracks{max-width:none} }
  .row small{color:var(--ink-dim)}
  .row.playing{background:rgba(111,242,228,.16)}
  .row.missing{opacity:.5}
  .acts{display:flex;gap:4px;flex-shrink:0}

  .btn{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:10px;
       padding:6px 11px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;
       align-items:center;gap:5px;white-space:nowrap}
  .btn:hover{background:var(--glass-strong)}
  .btn.primary{background:var(--aqua);color:#012129;border-color:var(--aqua);font-weight:600}
  .btn.icon{padding:5px 8px}
  .btn.danger:hover{background:rgba(255,90,90,.25)}

  .head{display:flex;gap:18px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
  .head .thumb{width:150px;flex-shrink:0}
  .head .info{flex:1;min-width:200px}
  .head .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .crumb{font-size:13px;color:var(--ink-dim);margin-bottom:14px;cursor:pointer}
  .crumb:hover{color:var(--ink)}
  .crumb.path{cursor:default}
  .crumb.path span{cursor:pointer}
  .crumb.path span:hover{color:var(--aqua);text-decoration:underline}

  input.text{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
             color:var(--ink);padding:8px 11px;font-size:14px;outline:none}

  .empty{color:var(--ink-dim);text-align:center;padding:40px}

  /* Player bar */
  .player{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(1,33,41,.92);
          border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:8px 16px;
          display:none;align-items:center;gap:14px}
  .player.on{display:flex}
  .player .now{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
  .player audio{flex:2;min-width:180px;height:36px}

  /* Floating "currently adding" search */
  .fab{position:fixed;left:16px;bottom:22px;z-index:20;transition:bottom .2s}
  body.playing .fab{bottom:76px}
  .fab .bubble{background:var(--aqua);color:#012129;border-radius:26px;padding:12px 16px;font-weight:600;
               box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer;display:flex;align-items:center;gap:8px;
               max-width:calc(100vw - 32px)}
  .fab .bubble span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fab .search{display:none;margin-bottom:10px;background:#022b33;border:1px solid var(--aqua);
               border-radius:16px;padding:12px;width:min(360px,calc(100vw - 32px));box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .fab.open .search{display:block}
  .fab input,.fab select{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
             color:var(--ink);padding:9px 11px;font-size:14px;outline:none}
  .fab select{margin-bottom:8px}
  .res{max-height:300px;overflow:auto;margin-top:8px}
  .res .grp{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--aqua-dim);margin:8px 2px 4px}
  .res .item{padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
  .res .item:hover{background:var(--glass-strong)}
  .res .item .main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res .item small{color:var(--ink-dim)}

  .toast{position:fixed;right:16px;top:16px;z-index:30;background:#022b33;border:1px solid var(--aqua);
         border-radius:12px;padding:10px 14px;font-size:13px;opacity:0;transform:translateY(-8px);
         transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:none}

  /* Add-to-playlist popover */
  .pop{position:absolute;z-index:25;background:#022b33;border:1px solid var(--aqua);border-radius:12px;
       padding:6px;min-width:200px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .pop div{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
  .pop div:hover{background:var(--glass-strong)}
  .pop .new{color:var(--aqua);border-top:1px solid var(--line);margin-top:4px}

  @media (max-width:600px){
    .head .thumb{width:110px}
    .row .r-genre{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Aquaria Music Manager</h1>
  <div class="sub" id="stats">loading library…</div>

  <div class="users" id="users"></div>

  <div class="tabs">
    <div class="tab" data-tab="activity">Activity</div>
    <div class="tab" data-tab="ipod">My iPod</div>
    <div class="tab" data-tab="playlists">Playlists</div>
    <div class="tab active" data-tab="library">Library</div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<!-- currently-adding search -->
<div class="fab" id="fab">
  <div class="search">
    <select id="editSel" title="Playlist that search results are added to"></select>
    <input id="q" placeholder="Search songs, albums, artists…" autocomplete="off">
    <div class="res" id="res"></div>
  </div>
  <div class="bubble" id="fabBtn">✏️ <span id="fabLabel">Search</span> · 🔍</div>
</div>

<div class="player" id="player">
  <div class="now" id="now"></div>
  <audio id="audio" controls preload="none"></audio>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = p => p.split("/").map(encodeURIComponent).join("/");

let VIEW = "genre";
let PATH = [];               // folder-browse position, e.g. ["0_FOLK","Pete Seeger"]
let BACK = null;             // where an album page's "←" returns to
let EDITING = null;          // playlist id that search results add to
let PLAYLISTS = [];
let QUEUE = [], QI = -1;     // play queue of {rel_path,title,artist}

async function api(path, opts){
  const r = await fetch(path, opts);
  const body = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}
const post = (path, data, method="POST") => api(path, {method,
  headers:{"Content-Type":"application/json"}, body: data ? JSON.stringify(data) : undefined});

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),2200);
}

async function loadStats(){
  const s = await api("/api/stats");
  $("#stats").textContent =
    `${s.tracks} tracks · ${s.albums} albums · ${s.artists} artists · ${s.genres} genres`;
  return s;
}

async function loadUsers(){
  const {users} = await api("/api/users");
  const el = $("#users");
  if(!users.length){ el.innerHTML = ""; return; }
  el.innerHTML = users.map((u,i)=>`
    <div class="user ${i===0?'active':''}">
      <div class="name">${esc(u.username)}</div>
      <div class="ipods">${u.ipods.length ? u.ipods.map(p=>esc(p.name)).join(" · ") : "no iPods linked"}</div>
    </div>`).join("");
}

async function loadPlaylists(){
  PLAYLISTS = (await api("/api/playlists")).playlists;
  $("#editSel").innerHTML = `<option value="">— click a result to play —</option>` +
    PLAYLISTS.map(p=>`<option value="${p.id}" ${p.id===EDITING?'selected':''}>Add to: ${esc(p.name)}</option>`).join("");
  const cur = PLAYLISTS.find(p=>p.id===EDITING);
  if(!cur) EDITING = null;
  $("#fabLabel").textContent = cur ? `Editing ${cur.name}` : "Search";
}

// ── Player ──────────────────────────────────────────────────────────────────
function play(tracks, i){
  QUEUE = tracks; QI = i;
  const t = QUEUE[QI]; if(!t) return;
  const a = $("#audio");
  a.src = "/media/" + enc(t.rel_path); a.play();
  $("#now").innerHTML = `▶ <b>${esc(t.title)}</b> <small>· ${esc(t.artist||"")}</small>`;
  $("#player").classList.add("on"); document.body.classList.add("playing");
  document.querySelectorAll(".row.playing").forEach(r=>r.classList.remove("playing"));
  document.querySelectorAll(`.row[data-rel="${CSS.escape(t.rel_path)}"]`).forEach(r=>r.classList.add("playing"));
}
$("#audio").onended = () => { if(QI+1 < QUEUE.length) play(QUEUE, QI+1); };

// ── Add-to-playlist popover ─────────────────────────────────────────────────
function closePop(){ document.querySelectorAll(".pop").forEach(p=>p.remove()); }
document.addEventListener("click", e=>{ if(!e.target.closest(".pop,[data-add]")) closePop(); });

async function addTo(pid, payload){
  const r = await post(`/api/playlists/${pid}/tracks`, payload);
  const p = PLAYLISTS.find(x=>x.id===pid);
  toast(r.added ? `Added ${r.added} to ${p?p.name:"playlist"}` : "Already in playlist");
  loadPlaylists();
}

async function newPlaylist(){
  const name = prompt("New playlist name");
  if(!name) return null;
  try { const p = await post("/api/playlists", {name}); await loadPlaylists(); return p.id; }
  catch(e){ toast(e.message); return null; }
}

function showAddPop(btn, payload){
  closePop();
  const pop = document.createElement("div"); pop.className="pop";
  pop.innerHTML = PLAYLISTS.map(p=>`<div data-pid="${p.id}">${esc(p.name)}</div>`).join("") +
                  `<div class="new">+ New playlist…</div>`;
  const r = btn.getBoundingClientRect();
  pop.style.top = (window.scrollY + r.bottom + 4) + "px";
  pop.style.left = Math.max(8, Math.min(window.scrollX + r.right - 200, innerWidth - 216)) + "px";
  pop.onclick = async e=>{
    const d = e.target.closest("div"); if(!d) return;
    closePop();
    const pid = d.dataset.pid ? +d.dataset.pid : await newPlaylist();
    if(pid) addTo(pid, payload);
  };
  document.body.appendChild(pop);
}

// ── Library ─────────────────────────────────────────────────────────────────
const icon = t => ({head:'👤', genre:'🗂️'})[t] || '💿';
const yr = y => y ? ` (${y})` : "";

function tile(a, attrs){
  const round = a.icon==='head' ? 'round':'';
  const img = a.image ? `<img loading="lazy" src="${esc(a.image)}" onerror="this.replaceWith('${icon(a.icon)}')">` : icon(a.icon||'album');
  const meta = a.icon==='head'
     ? `${a.n_albums} album${a.n_albums===1?'':'s'}`
     : `${a.n_tracks} tracks${a.year? ' · '+a.year:''}`;
  return `<div class="tile" ${attrs}>
      <div class="thumb ${round}">${img}</div>
      <div class="t-name" title="${esc(a.name)}">${esc(a.name)}</div>
      <div class="t-meta">${esc(a.sub||meta)}</div>
    </div>`;
}
const albumTile = (a, sub) => tile({name:a.album, sub, n_tracks:a.n_tracks, year:a.year,
  icon:'album', image:"/art/"+enc(a.folder)}, `data-folder="${esc(a.folder)}"`);

function wireFolders(root, back){
  root.querySelectorAll("[data-folder]").forEach(el=>el.onclick=()=>{ BACK = back; renderAlbum(el.dataset.folder); });
}

// ── Folder browse: mirrors FLAC/ on disk (0_GENRE/Artist/Album, or 0_GENRE/Artist - Album) ──
let TREE = null;
const genreLabel = n => n.replace(/^\d+_/, "");

function buildTree(albums){
  const root = {kids:{}, albums:[]};
  for(const a of albums){
    const parts = a.folder.split("/");
    let node = root;
    for(const p of parts.slice(0,-1)) node = node.kids[p] ??= {kids:{}, albums:[]};
    node.albums.push(a);
  }
  return root;
}
function countAlbums(n){ return n.albums.length + Object.values(n.kids).reduce((s,k)=>s+countAlbums(k),0); }

function renderFolder(body){
  let node = TREE;
  for(const p of PATH) node = node?.kids[p];
  if(!node){ PATH = []; node = TREE; }
  const crumbs = [`<span data-depth="0">FLAC</span>`].concat(PATH.map((p,i)=>
    `<span data-depth="${i+1}">${esc(i===0?genreLabel(p):p)}</span>`)).join(" / ");
  const depth = PATH.length;
  const folders = Object.keys(node.kids).sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
  const albums = [...node.albums].sort((a,b)=>(a.artist_key+a.year).localeCompare(b.artist_key+b.year));
  const folderTile = name => {
    const k = node.kids[name], n = countAlbums(k), sub = Object.keys(k.kids).length;
    return tile({name: depth===0 ? genreLabel(name) : name,
      sub: depth===0 ? `${sub} folders · ${n} albums` : `${n} album${n===1?'':'s'}`,
      icon: depth===0 ? 'genre' : 'head'}, `data-sub="${esc(name)}"`);
  };
  body.innerHTML = `<div class="crumb path">${crumbs}</div>
    <div class="grid">${folders.map(folderTile).join("")}${albums.map(a=>albumTile(a,
      depth>=2 ? (a.year||"") : `${a.artist}${a.year?' · '+a.year:''}`)).join("")}</div>`;
  body.querySelectorAll("[data-depth]").forEach(c=>c.onclick=()=>{ PATH = PATH.slice(0,+c.dataset.depth); renderFolder(body); });
  body.querySelectorAll("[data-sub]").forEach(el=>el.onclick=()=>{ PATH = [...PATH, el.dataset.sub]; renderFolder(body); });
  wireFolders(body, renderLibrary);
}

let ARTISTS = null;

async function renderLibrary(){
  const panel = $("#panel");
  panel.innerHTML = `<div class="seg">
      <button data-v="genre">Folders</button>
      <button data-v="artist">Artist &amp;/or Album</button>
      <button data-v="all_albums">All Albums</button>
    </div><div id="libbody"><div class="empty">loading…</div></div>`;
  panel.querySelectorAll(".seg button").forEach(b=>{
    if(b.dataset.v===VIEW) b.classList.add("on");
    b.onclick=()=>{ VIEW=b.dataset.v; PATH=[]; renderLibrary(); };
  });
  const body = $("#libbody");
  const {items} = await api("/api/library?view="+(VIEW==="genre" ? "all_albums" : VIEW));
  if(!items.length){ body.innerHTML=`<div class="empty">Library is empty or still indexing — refresh in a moment.</div>`; return; }

  if(VIEW==="genre"){
    TREE = buildTree(items);
    renderFolder(body);
    return;
  } else if(VIEW==="artist"){
    ARTISTS = items;
    body.innerHTML = `<div class="grid">${items.map((a,i)=>tile({
        name:a.artist, icon:'head', image:a.image ? "/media/"+enc(a.image) : null,
        n_albums:a.n_albums}, `data-ai="${i}"`)).join("")}</div>`;
    body.querySelectorAll("[data-ai]").forEach(el=>el.onclick=()=>renderArtist(ARTISTS[+el.dataset.ai]));
  } else {
    body.innerHTML = `<div class="list">${items.map(a=>`
      <div class="row click" data-folder="${esc(a.folder)}">
        <div class="main">${esc(a.display_all_albums)}</div>
        <div class="r-genre">${esc(a.genre||'')} · ${a.n_tracks} trk</div>
      </div>`).join("")}</div>`;
  }
  wireFolders(body, renderLibrary);
}

function renderArtist(a){
  $("#panel").innerHTML = `<div class="crumb" id="back">← Library</div>
    <h2>${esc(a.artist)}</h2><div class="sub">${a.n_albums} albums · ${a.n_tracks} tracks</div>
    <div class="grid">${a.albums.map(al=>albumTile(al, al.year||"")).join("")}</div>`;
  $("#back").onclick = renderLibrary;
  wireFolders($("#panel"), ()=>renderArtist(a));
}

async function renderAlbum(folder){
  const al = await api("/api/album?folder="+encodeURIComponent(folder));
  const tracks = al.tracks;
  $("#panel").innerHTML = `<div class="crumb" id="back">← Library</div>
    <div class="head">
      <div class="thumb"><img src="/art/${enc(folder)}" onerror="this.replaceWith('💿')"></div>
      <div class="info">
        <h2>${esc(al.album)}${yr(al.year)}</h2>
        <div class="sub" style="margin:0">${esc(al.artist)}${al.genre?' · '+esc(al.genre):''} · ${tracks.length} tracks</div>
        <div class="bar">
          <button class="btn primary" id="playAll">▶ Play</button>
          <a class="btn" href="/download/album?folder=${encodeURIComponent(folder)}">⬇ Download album (.zip)</a>
          <button class="btn" data-add id="addAll">＋ Add to playlist</button>
        </div>
      </div>
    </div>
    <div class="list tracks">${tracks.map((t,i)=>`
      <div class="row" data-rel="${esc(t.rel_path)}">
        <div class="num">${t.disc_no?t.disc_no+'-':''}${t.track_no??i+1}</div>
        <button class="btn icon hoverplay" data-play="${i}" title="Play">▶</button>
        <div class="main">${esc(t.title)} <small>· ${esc((t.ext||'').toUpperCase())}</small></div>
        <div class="acts">
          <a class="btn icon" href="/download/track/${enc(t.rel_path)}" title="Download">⬇</a>
          <button class="btn icon" data-add="${i}" title="Add to playlist">＋</button>
        </div>
      </div>`).join("")}</div>`;
  $("#back").onclick = BACK || renderLibrary;
  $("#playAll").onclick = ()=>play(tracks, 0);
  $("#addAll").onclick = e=>{ e.stopPropagation(); showAddPop(e.currentTarget, {folder}); };
  document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>play(tracks, +b.dataset.play));
  document.querySelectorAll(".row [data-add]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); showAddPop(b, {rel_paths:[tracks[+b.dataset.add].rel_path]}); });
}

// ── Playlists ───────────────────────────────────────────────────────────────
async function renderPlaylists(){
  await loadPlaylists();
  $("#panel").innerHTML = `
    <form class="head" id="newForm" style="align-items:center">
      <input class="text" id="newName" placeholder="New playlist name" style="flex:1;min-width:180px">
      <button class="btn primary">＋ Create</button>
    </form>
    ${PLAYLISTS.length ? `<div class="list">${PLAYLISTS.map(p=>`
      <div class="row click" data-pid="${p.id}">
        <div class="main">🎶 ${esc(p.name)} <small>· ${p.n_tracks} tracks${p.n_missing?` · ${p.n_missing} unmatched`:''}</small></div>
        <div class="acts"><a class="btn icon" href="/download/playlist/${p.id}" title="Download (.zip)">⬇</a></div>
      </div>`).join("")}</div>`
    : `<div class="empty">No playlists yet.</div>`}`;
  $("#newForm").onsubmit = async e=>{
    e.preventDefault();
    const name = $("#newName").value.trim(); if(!name) return;
    try { const p = await post("/api/playlists", {name}); EDITING = p.id; renderPlaylist(p.id); }
    catch(err){ toast(err.message); }
  };
  document.querySelectorAll("[data-pid]").forEach(r=>r.onclick=e=>{
    if(e.target.closest("a")) return; renderPlaylist(+r.dataset.pid); });
}

async function renderPlaylist(pid){
  await loadPlaylists();
  const pl = await api(`/api/playlists/${pid}`);
  const playable = pl.items.filter(i=>i.rel_path);
  const editing = EDITING===pid;
  $("#panel").innerHTML = `<div class="crumb" id="back">← Playlists</div>
    <div class="head" style="align-items:center">
      <div class="info">
        <h2>🎶 ${esc(pl.name)}</h2>
        <div class="sub" style="margin:0">${pl.items.length} tracks</div>
        <div class="bar">
          <button class="btn primary" id="playAll" ${playable.length?'':'disabled'}>▶ Play</button>
          <a class="btn" href="/download/playlist/${pid}">⬇ Download (.zip)</a>
          <button class="btn" id="edit">${editing?'✓ Adding from search':'✏️ Add songs via search'}</button>
          <button class="btn danger" id="del">🗑 Delete</button>
        </div>
      </div>
    </div>
    ${pl.items.length ? `<div class="list">${pl.items.map((it,i)=>`
      <div class="row ${it.rel_path?'':'missing'}" ${it.rel_path?`data-rel="${esc(it.rel_path)}"`:''}>
        <div class="num">${i+1}</div>
        <div class="main">${it.rel_path
          ? `${esc(it.title)} <small>· ${esc(it.artist)} — ${esc(it.album)}</small>`
          : `<small title="not found in library">⚠ ${esc(it.raw_line)}</small>`}</div>
        <div class="acts">
          ${it.rel_path?`<button class="btn icon" data-play="${esc(it.rel_path)}" title="Play">▶</button>
          <a class="btn icon" href="/download/track/${enc(it.rel_path)}" title="Download">⬇</a>`:''}
          <button class="btn icon" data-mv="${it.item_id}:-1" title="Move up">↑</button>
          <button class="btn icon" data-mv="${it.item_id}:1" title="Move down">↓</button>
          <button class="btn icon danger" data-rm="${it.item_id}" title="Remove">✕</button>
        </div>
      </div>`).join("")}</div>`
    : `<div class="empty">Empty — click “Add songs via search”, or use ＋ on any album.</div>`}`;
  $("#back").onclick = renderPlaylists;
  $("#playAll").onclick = ()=>play(playable, 0);
  $("#edit").onclick = ()=>{ EDITING = editing ? null : pid; loadPlaylists();
    if(!editing){ $("#fab").classList.add("open"); $("#q").focus(); } renderPlaylist(pid); };
  $("#del").onclick = async ()=>{
    if(!confirm(`Delete playlist “${pl.name}”? (The .m3u is kept as .m3u.deleted)`)) return;
    await post(`/api/playlists/${pid}`, null, "DELETE"); if(EDITING===pid) EDITING=null;
    toast("Playlist deleted"); renderPlaylists(); };
  document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>
    play(playable, playable.findIndex(t=>t.rel_path===b.dataset.play)));
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    await post(`/api/playlists/${pid}/items/${b.dataset.rm}`, null, "DELETE"); renderPlaylist(pid); });
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=async()=>{
    const [iid, d] = b.dataset.mv.split(":");
    await post(`/api/playlists/${pid}/items/${iid}/move`, {delta:+d}); renderPlaylist(pid); });
}

function renderStub(name){
  $("#panel").innerHTML = `<div class="empty">“${esc(name)}” module — scaffolded in the backend,
    UI arrives in a later iteration.</div>`;
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  const k=t.dataset.tab;
  if(k==="library") renderLibrary();
  else if(k==="playlists") renderPlaylists();
  else renderStub(t.textContent);
});

// ── currently-adding search ─────────────────────────────────────────────────
$("#fabBtn").onclick=()=>{ $("#fab").classList.toggle("open"); if($("#fab").classList.contains("open")) $("#q").focus(); };
$("#editSel").onchange=e=>{ EDITING = e.target.value ? +e.target.value : null; loadPlaylists(); };
let timer, RES = null;
$("#q").oninput=e=>{
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    const q=e.target.value.trim();
    if(!q){$("#res").innerHTML="";return;}
    RES = await api("/api/search?q="+encodeURIComponent(q));
    const verb = EDITING ? "＋" : "";
    const sec=(label,arr,fmt)=>arr.length?`<div class="grp">${label}</div>`+arr.map(fmt).join(""):"";
    $("#res").innerHTML =
      sec("Albums",RES.albums.slice(0,8),(a,i)=>`<div class="item" data-sa="${i}"><span class="main">💿 ${esc(a.artist)} — ${esc(a.album)}${yr(a.year)}</span>${verb}</div>`)+
      sec("Tracks",RES.tracks,(t,i)=>`<div class="item" data-st="${i}"><span class="main">🎵 ${esc(t.title)} <small>· ${esc(t.artist)}</small></span>${verb||'▶'}</div>`);
    if(!RES.tracks.length) $("#res").innerHTML = `<div class="item"><small>No matches</small></div>`;
  },180);
};
$("#res").onclick = e=>{
  const it = e.target.closest(".item"); if(!it || !RES) return;
  if(it.dataset.sa!==undefined){
    const a = RES.albums[+it.dataset.sa];
    if(EDITING) addTo(EDITING, {folder:a.folder}); else { BACK = null; renderAlbum(a.folder); }
  } else if(it.dataset.st!==undefined){
    const t = RES.tracks[+it.dataset.st];
    EDITING ? addTo(EDITING, {rel_paths:[t.rel_path]}) : play([t], 0);
  }
  if(EDITING && document.querySelector("#panel h2")?.textContent.startsWith("🎶"))
    setTimeout(()=>renderPlaylist(EDITING), 150);
};

(async ()=>{
  loadUsers(); loadPlaylists();
  const s = await loadStats();
  renderLibrary();
  // First boot: the server indexes in the background — poll until tracks appear.
  if(!s.tracks){
    const iv = setInterval(async()=>{ const s2 = await loadStats();
      if(s2.tracks){ clearInterval(iv); loadUsers(); loadPlaylists(); renderLibrary(); } }, 3000);
  }
})();
</script>
</body>
</html>
