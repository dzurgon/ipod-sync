<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquaria Music Manager</title>
<style>
  :root{
    --backdrop: linear-gradient(160deg,#012a36 0%,#034e5c 38%,#0a7c86 72%,#3fd0c9 100%);
    --glass: rgba(255,255,255,.08);
    --glass-strong: rgba(255,255,255,.14);
    --line: rgba(180,255,247,.16);
    --aqua: #6ff2e4;
    --aqua-dim: #7fd8cf;
    --ink: #eafffb;
    --ink-dim: #9fc4c0;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--backdrop) fixed;
  }
  a{color:var(--aqua)}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 16px 150px}
  h1{font-weight:700;letter-spacing:.3px;margin:0 0 2px;font-size:26px;
     text-shadow:0 2px 18px rgba(0,0,0,.35)}
  h2{margin:0 0 4px;font-size:20px}
  .sub{color:var(--ink-dim);font-size:13px;margin-bottom:22px}

  /* Header + account */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .acct .me{color:var(--ink);text-decoration:none;font-weight:600}
  .acct .me:hover{color:var(--aqua)}
  .card{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 4px;font-size:16px}
  .form{display:grid;gap:12px;max-width:360px}
  .form label{font-size:13px;color:var(--ink-dim);display:grid;gap:4px}
  .opts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
  .opts label{display:flex;align-items:center;gap:6px;color:var(--ink)}
  .sec-h{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--aqua-dim);margin:20px 0 8px}
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--ink-dim)}
  .pill.ok{border-color:var(--aqua);color:var(--aqua)}
  .pill.err{border-color:#ff8a8a;color:#ffb3b3}
  .avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(145deg,#0b5b63,#0a3b45);
          border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;flex-shrink:0}
  .settings{display:grid;gap:14px;margin-top:12px}
  .settings > div > b{display:block;font-size:12px;color:var(--ink-dim);font-weight:600;margin-bottom:6px}

  /* Users row */
  .users{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  a.user{color:inherit;text-decoration:none}
  .user{background:var(--glass);border:1px solid var(--line);border-radius:16px;
        padding:12px 16px;min-width:150px;backdrop-filter:blur(8px)}
  .user.active{border-color:var(--aqua);box-shadow:0 0 0 1px var(--aqua),0 8px 30px rgba(111,242,228,.18)}
  .user .name{font-weight:600}
  .user .ipods{font-size:11px;color:var(--ink-dim);margin-top:3px}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;
       border:1px solid var(--line);background:var(--glass);color:var(--ink-dim);transition:.15s}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--aqua);color:#012129;font-weight:600;border-color:var(--aqua)}

  .panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;
         padding:20px;backdrop-filter:blur(10px);min-height:220px}

  /* Library toggle */
  .seg{display:inline-flex;background:rgba(0,0,0,.22);border-radius:14px;padding:4px;margin-bottom:18px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;color:var(--ink-dim);padding:7px 14px;border-radius:11px;
              cursor:pointer;font-size:13px;transition:.15s}
  .seg button.on{background:var(--aqua);color:#012129;font-weight:600}

  .genre-h{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--aqua-dim);
           margin:22px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}

  .tile{cursor:pointer;transition:.16s;min-width:0}
  .tile:hover{transform:translateY(-3px)}
  .thumb{width:100%;aspect-ratio:1;border-radius:14px;background:
         linear-gradient(145deg,#0b5b63,#0a3b45);display:flex;align-items:center;justify-content:center;
         font-size:34px;border:1px solid var(--line);overflow:hidden}
  .thumb.round{border-radius:50%}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .t-name{margin-top:8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-meta{font-size:11px;color:var(--ink-dim)}
  .t-genre{font-size:10px;color:var(--aqua-dim);letter-spacing:.4px}

  /* Rows (all-albums list, tracklists, playlists) */
  .list .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;
             border-bottom:1px solid var(--line);border-radius:8px}
  .list .row.click{cursor:pointer}
  .list .row:hover{background:var(--glass-strong)}
  .list .row .r-genre{font-size:11px;color:var(--aqua-dim);white-space:nowrap}
  .row .main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .num{color:var(--ink-dim);width:28px;font-variant-numeric:tabular-nums;font-size:13px}
  /* Album tracklist: 5/8 width so the row actions stay near the title; play appears on hover */
  .list.tracks{max-width:62.5%}
  .row .hoverplay{opacity:0;transition:opacity .12s;flex-shrink:0}
  .row:hover .hoverplay,.row.playing .hoverplay,.row .hoverplay:focus-visible{opacity:1}
  @media (hover:none){ .row .hoverplay{opacity:1} }
  @media (max-width:900px){ .list.tracks{max-width:none} }
  .row small{color:var(--ink-dim)}
  .row.playing{background:rgba(111,242,228,.16)}
  .row.missing{opacity:.5}
  .acts{display:flex;gap:4px;flex-shrink:0}

  .btn{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:10px;
       padding:6px 11px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;
       align-items:center;gap:5px;white-space:nowrap}
  .btn:hover{background:var(--glass-strong)}
  .btn.primary{background:var(--aqua);color:#012129;border-color:var(--aqua);font-weight:600}
  .btn.icon{padding:5px 8px}
  .btn.danger:hover{background:rgba(255,90,90,.25)}

  .head{display:flex;gap:18px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
  .head .thumb{width:150px;flex-shrink:0}
  .head .info{flex:1;min-width:200px}
  .head .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .crumb{font-size:13px;color:var(--ink-dim);margin-bottom:14px;cursor:pointer}
  .crumb:hover{color:var(--ink)}
  .crumb a{color:inherit;text-decoration:none}
  .crumb a:hover{color:var(--aqua);text-decoration:underline}
  a.tab,a.tile,a.row,a.main,.seg a{color:inherit;text-decoration:none}
  .seg a{display:inline-block;color:var(--ink-dim);padding:7px 14px;border-radius:11px;font-size:13px;transition:.15s}
  .seg a.on{background:var(--aqua);color:#012129;font-weight:600}
  .tile{display:block}

  input.text{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
             color:var(--ink);padding:8px 11px;font-size:14px;outline:none}

  .empty{color:var(--ink-dim);text-align:center;padding:40px}

  /* Player bar */
  .player{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(1,33,41,.92);
          border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:8px 16px;
          display:none;align-items:center;gap:14px}
  .player.on{display:flex}
  .player .now{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
  .player audio{flex:2;min-width:180px;height:36px}

  /* Floating "currently adding" search */
  .fab{position:fixed;left:16px;bottom:22px;z-index:20;transition:bottom .2s}
  body.playing .fab{bottom:76px}
  .fab .bubble{background:var(--aqua);color:#012129;border-radius:26px;padding:12px 16px;font-weight:600;
               box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer;display:flex;align-items:center;gap:8px;
               max-width:calc(100vw - 32px)}
  .fab .bubble span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fab .search{display:none;margin-bottom:10px;background:#022b33;border:1px solid var(--aqua);
               border-radius:16px;padding:12px;width:min(360px,calc(100vw - 32px));box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .fab.open .search{display:block}
  .fab input,.fab select{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
             color:var(--ink);padding:9px 11px;font-size:14px;outline:none}
  .fab select{margin-bottom:8px}
  .res{max-height:300px;overflow:auto;margin-top:8px}
  .res .grp{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--aqua-dim);margin:8px 2px 4px}
  .res .item{padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
  .res .item:hover{background:var(--glass-strong)}
  .res .item .main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res .item small{color:var(--ink-dim)}

  .toast{position:fixed;right:16px;top:16px;z-index:30;background:#022b33;border:1px solid var(--aqua);
         border-radius:12px;padding:10px 14px;font-size:13px;opacity:0;transform:translateY(-8px);
         transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:none}

  /* Add-to-playlist popover */
  .pop{position:absolute;z-index:25;background:#022b33;border:1px solid var(--aqua);border-radius:12px;
       padding:6px;min-width:200px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .pop div{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
  .pop div:hover{background:var(--glass-strong)}
  .pop .new{color:var(--aqua);border-top:1px solid var(--line);margin-top:4px}

  @media (max-width:600px){
    .head .thumb{width:110px}
    .row .r-genre{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Aquaria Music Manager</h1>
      <div class="sub" id="stats">loading library…</div></div>
    <div class="acct" id="acct"></div>
  </div>

  <div class="users" id="users"></div>

  <div class="tabs">
    <a class="tab" data-link data-tab="activity" href="/activity">Activity</a>
    <a class="tab" data-link data-tab="ipod" href="/ipod">My iPod</a>
    <a class="tab" data-link data-tab="playlists" href="/playlists">Playlists</a>
    <a class="tab" data-link data-tab="library" href="/library">Library</a>
  </div>

  <div class="panel" id="panel"></div>
</div>

<!-- currently-adding search -->
<div class="fab" id="fab">
  <div class="search">
    <select id="editSel" title="Playlist that search results are added to"></select>
    <input id="q" placeholder="Search songs, albums, artists…" autocomplete="off">
    <div class="res" id="res"></div>
  </div>
  <div class="bubble" id="fabBtn">✏️ <span id="fabLabel">Search</span> · 🔍</div>
</div>

<div class="player" id="player">
  <div class="now" id="now"></div>
  <audio id="audio" controls preload="none"></audio>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = p => p.split("/").map(encodeURIComponent).join("/");

let VIEW = "genre";
let PATH = [];               // folder-browse position, e.g. ["0_FOLK","Pete Seeger"]
let NAV = 0;                 // bumped per navigation; stale async renders bail out
let EDITING = null;          // playlist id that search results add to
let PLAYLISTS = [];          // every playlist visible to the viewer
let MINE = [];               // the viewer's own (editable) playlists
let ME = null;               // {username, lastfm_user} when logged in
let LASTFM_OK = false;       // server has Last.fm API credentials
let QUEUE = [], QI = -1;     // play queue of {rel_path,title,artist}

async function api(path, opts){
  const r = await fetch(path, opts);
  const body = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}
const post = (path, data, method="POST") => api(path, {method,
  headers:{"Content-Type":"application/json"}, body: data ? JSON.stringify(data) : undefined});

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),2200);
}

async function loadStats(){
  const s = await api("/api/stats");
  $("#stats").textContent =
    `${s.tracks} tracks · ${s.albums} albums · ${s.artists} artists · ${s.genres} genres`;
  return s;
}

async function loadMe(){
  const r = await api("/api/auth/me");
  ME = r.user; LASTFM_OK = r.lastfm_available;
  $("#acct").innerHTML = ME
    ? `<a class="me" data-link href="/user/${encodeURIComponent(ME.username)}">👤 ${esc(ME.username)}</a>
       <button class="btn" id="logout">Log out</button>`
    : `<a class="btn" data-link href="/login">Log in</a><a class="btn primary" data-link href="/signup">Sign up</a>`;
  if(ME) $("#logout").onclick = async ()=>{ await post("/api/auth/logout"); await refreshSession(); toast("Logged out"); };
}

// After login/logout: reload who-am-I, the user row and playlists, then redraw the page.
async function refreshSession(){
  EDITING = null;
  await loadMe(); await Promise.all([loadUsers(), loadPlaylists()]); route();
}

async function loadUsers(){
  const {users} = await api("/api/users");
  $("#users").innerHTML = users.filter(u=>u.claimed).map(u=>`
    <a class="user ${ME && ME.username===u.username ? 'active':''}" data-link href="/user/${encodeURIComponent(u.username)}">
      <div class="name">${esc(u.username)}</div>
      <div class="ipods">${u.n_public} public playlist${u.n_public===1?'':'s'} · ${u.n_ipods} iPod${u.n_ipods===1?'':'s'}</div>
    </a>`).join("");
}

async function loadPlaylists(){
  PLAYLISTS = (await api("/api/playlists")).playlists;
  MINE = PLAYLISTS.filter(p=>p.is_mine);
  $("#editSel").hidden = !ME;
  $("#editSel").innerHTML = `<option value="">— click a result to play —</option>` +
    MINE.map(p=>`<option value="${p.id}" ${p.id===EDITING?'selected':''}>Add to: ${esc(p.name)}</option>`).join("");
  const cur = MINE.find(p=>p.id===EDITING);
  if(!cur) EDITING = null;
  $("#fabLabel").textContent = cur ? `Editing ${cur.name}` : "Search";
}

// ── Player ──────────────────────────────────────────────────────────────────
function play(tracks, i){
  QUEUE = tracks; QI = i;
  const t = QUEUE[QI]; if(!t) return;
  const a = $("#audio");
  a.src = "/media/" + enc(t.rel_path); a.play();
  $("#now").innerHTML = `▶ <b>${esc(t.title)}</b> <small>· ${esc(t.artist||"")}</small>`;
  $("#player").classList.add("on"); document.body.classList.add("playing");
  document.querySelectorAll(".row.playing").forEach(r=>r.classList.remove("playing"));
  document.querySelectorAll(`.row[data-rel="${CSS.escape(t.rel_path)}"]`).forEach(r=>r.classList.add("playing"));
}
$("#audio").onended = () => { if(QI+1 < QUEUE.length) play(QUEUE, QI+1); };

// ── Add-to-playlist popover ─────────────────────────────────────────────────
function closePop(){ document.querySelectorAll(".pop").forEach(p=>p.remove()); }
document.addEventListener("click", e=>{ if(!e.target.closest(".pop,[data-add]")) closePop(); });

async function addTo(pid, payload){
  const r = await post(`/api/playlists/${pid}/tracks`, payload);
  const p = MINE.find(x=>x.id===pid);
  toast(r.added ? `Added ${r.added} to ${p?p.name:"playlist"}` : "Already in playlist");
  loadPlaylists();
}

function needLogin(what){
  toast(`Log in to ${what}`);
  go("/login?next=" + encodeURIComponent(location.pathname));
}

async function newPlaylist(){
  const name = prompt("New playlist name");
  if(!name) return null;
  try { const p = await post("/api/playlists", {name}); await loadPlaylists(); return p.id; }
  catch(e){ toast(e.message); return null; }
}

function showAddPop(btn, payload){
  closePop();
  if(!ME) return needLogin("make playlists");
  const pop = document.createElement("div"); pop.className="pop";
  pop.innerHTML = MINE.map(p=>`<div data-pid="${p.id}">${esc(p.name)}</div>`).join("") +
                  `<div class="new">+ New playlist…</div>`;
  const r = btn.getBoundingClientRect();
  pop.style.top = (window.scrollY + r.bottom + 4) + "px";
  pop.style.left = Math.max(8, Math.min(window.scrollX + r.right - 200, innerWidth - 216)) + "px";
  pop.onclick = async e=>{
    const d = e.target.closest("div"); if(!d) return;
    closePop();
    const pid = d.dataset.pid ? +d.dataset.pid : await newPlaylist();
    if(pid) addTo(pid, payload);
  };
  document.body.appendChild(pop);
}

// ── Library ─────────────────────────────────────────────────────────────────
const icon = t => ({head:'👤', genre:'🗂️'})[t] || '💿';
const yr = y => y ? ` (${y})` : "";

function tile(a, href){
  const round = a.icon==='head' ? 'round':'';
  const img = a.image ? `<img loading="lazy" src="${esc(a.image)}" onerror="this.replaceWith('${icon(a.icon)}')">` : icon(a.icon||'album');
  const meta = a.icon==='head'
     ? `${a.n_albums} album${a.n_albums===1?'':'s'}`
     : `${a.n_tracks} tracks${a.year? ' · '+a.year:''}`;
  return `<a class="tile" data-link href="${esc(href)}">
      <div class="thumb ${round}">${img}</div>
      <div class="t-name" title="${esc(a.name)}">${esc(a.name)}</div>
      <div class="t-meta">${esc(a.sub||meta)}</div>
    </a>`;
}
const albumTile = (a, sub) => tile({name:a.album, sub, n_tracks:a.n_tracks, year:a.year,
  icon:'album', image:"/art/"+enc(a.folder)+"?v="+IMGV}, "/album/"+enc(a.folder));

// ── Folder browse: mirrors FLAC/ on disk (0_GENRE/Artist/Album, or 0_GENRE/Artist - Album) ──
let TREE = null;

// ── Folder artwork: <folder>/<folder name>.jpg for genre + artist folders ──
let ARTDIRS = {};              // artist rel_dir -> {rel_dir, artist_key, artist, image}
let GENREDIRS = {};            // genre rel_dir  -> {rel_dir, genre, image}
let IMGV = Date.now();         // cache-buster, bumped whenever a photo changes
const imgUrl = rel => "/media/" + enc(rel) + "?v=" + IMGV;

async function loadArtDirs(){
  const fa = await api("/api/folder-art");
  ARTDIRS = Object.fromEntries(fa.artists.map(f=>[f.rel_dir, f]));
  GENREDIRS = Object.fromEntries(fa.genres.map(f=>[f.rel_dir, f]));
}

function artistHeader(dirs, title, sub, genre=false){
  const img = dirs.find(d=>d.image)?.image;
  return `<div class="head">
      <div class="thumb ${genre?'':'round'}">${img ? `<img src="${imgUrl(img)}">` : (genre?"🗂️":"👤")}</div>
      <div class="info">
        <h2>${esc(title)}</h2><div class="sub" style="margin:0">${esc(sub)}</div>
        ${ME ? `<div class="bar">
          <button class="btn" id="artFetch">🔍 ${img ? "Re-fetch" : "Fetch"} ${genre?"artwork":"photo"}</button>
          <label class="btn">⬆ Upload ${genre?"artwork":"photo"}<input type="file" id="artUpload" accept="image/jpeg,image/png,image/webp" hidden></label>
        </div>
        <div class="sub" style="margin:6px 0 0;font-size:11px">Saved as <code>${esc(dirs[0].rel_dir)}/${esc(dirs[0].rel_dir.split("/").pop())}.jpg</code>${dirs.length>1?` (+${dirs.length-1} other genre folder${dirs.length>2?'s':''})`:''}</div>` : ""}
      </div>
    </div>`;
}

function wireArtistHeader(dirs, rerender){
  if(!ME) return;
  const done = async msg => { IMGV = Date.now(); await loadArtDirs(); toast(msg); rerender(); };
  $("#artFetch").onclick = async e => {
    e.currentTarget.disabled = true; e.currentTarget.textContent = "Searching Deezer…";
    try {
      for(const d of dirs) await post("/api/folder-art/fetch", {rel_dir:d.rel_dir});
      done("Photo saved");
    } catch(err){ toast(err.message); rerender(); }
  };
  $("#artUpload").onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try {
      for(const d of dirs){
        const fd = new FormData(); fd.append("rel_dir", d.rel_dir); fd.append("file", f);
        await api("/api/folder-art/upload", {method:"POST", body:fd});
      }
      done("Photo uploaded");
    } catch(err){ toast(err.message); }
  };
}
const genreLabel = n => n.replace(/^\d+_/, "");

function buildTree(albums){
  const root = {kids:{}, albums:[]};
  for(const a of albums){
    const parts = a.folder.split("/");
    let node = root;
    for(const p of parts.slice(0,-1)) node = node.kids[p] ??= {kids:{}, albums:[]};
    node.albums.push(a);
  }
  return root;
}
function countAlbums(n){ return n.albums.length + Object.values(n.kids).reduce((s,k)=>s+countAlbums(k),0); }

function renderFolder(body){
  let node = TREE;
  for(const p of PATH) node = node?.kids[p];
  if(!node){ PATH = []; node = TREE; }
  const crumbs = [`<a data-link href="/library">FLAC</a>`].concat(PATH.map((p,i)=>
    `<a data-link href="/library/${enc(PATH.slice(0,i+1).join("/"))}">${esc(i===0?genreLabel(p):p)}</a>`)).join(" / ");
  const depth = PATH.length;
  const folders = Object.keys(node.kids).sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
  const albums = [...node.albums].sort((a,b)=>(a.artist_key+a.year).localeCompare(b.artist_key+b.year));
  const folderTile = name => {
    const k = node.kids[name], n = countAlbums(k), sub = Object.keys(k.kids).length;
    const ad = (depth===0 && GENREDIRS[name]) || ARTDIRS[[...PATH, name].join("/")];
    return tile({name: depth===0 ? genreLabel(name) : name,
      sub: depth===0 ? `${sub} folders · ${n} albums` : `${n} album${n===1?'':'s'}`,
      icon: depth===0 ? 'genre' : 'head', image: ad?.image ? imgUrl(ad.image) : null},
      "/library/"+enc([...PATH, name].join("/")));
  };
  const here = ARTDIRS[PATH.join("/")], gHere = depth===1 && GENREDIRS[PATH[0]];
  const nMissing = Object.values(GENREDIRS).concat(Object.values(ARTDIRS)).filter(d=>!d.image).length;
  body.innerHTML = `<div class="crumb path">${crumbs}</div>
    ${depth===0 ? fetchBar(nMissing, "artwork") : ""}
    ${here ? artistHeader([here], here.artist, `${countAlbums(node)} albums · ${genreLabel(PATH[0])}`) : ""}
    ${gHere ? artistHeader([gHere], gHere.genre, `${folders.length} folders · ${countAlbums(node)} albums`, true) : ""}
    <div class="grid">${folders.map(folderTile).join("")}${albums.map(a=>albumTile(a,
      depth>=2 ? (a.year||"") : `${a.artist}${a.year?' · '+a.year:''}`)).join("")}</div>`;
  if(here || gHere) wireArtistHeader([here || gHere], ()=>renderFolder(body));
  if(depth===0) wireFetchBar();
  setTitle(PATH.length ? (depth===1 ? genreLabel(PATH[0]) : PATH[depth-1]) : "Library");
}

const fetchBar = (n) => !ME ? "" : `<div class="bar" style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn" id="fetchMissing" ${n?'':'disabled'}>🔍 Fetch missing genre &amp; artist artwork (${n})</button>

function wireFetchBar(){
  if(!ME) return;
  $("#fetchMissing").onclick = async ()=>{ await post("/api/folder-art/fetch-missing"); pollFetch(); };
  pollFetch();
}

let FETCHING = false;           // saw the bulk job running → re-render once it finishes
async function pollFetch(){
  const j = await api("/api/folder-art/fetch-missing");
  const st = $("#fetchStatus"); if(!st) return;
  if(j.running){
    FETCHING = true;
    $("#fetchMissing").disabled = true;
    st.textContent = `Fetching… ${j.done}/${j.total} · ${j.found} found`;
    setTimeout(pollFetch, 1500);
  } else if(j.total){
    st.textContent = `Last run: ${j.found} of ${j.total} found` +
      (j.missing.length ? ` — nothing found for ${j.missing.length}; open those folders to upload one` : "");
    if(FETCHING){ FETCHING = false; IMGV = Date.now(); renderLibrary(); }
  }
}

const ago = ts => { if(!ts) return "never"; const s = Date.now()/1000 - ts;
  return s < 90 ? "just now" : s < 5400 ? `${Math.round(s/60)} min ago` : s < 129600 ? `${Math.round(s/3600)} h ago`
       : `${Math.round(s/86400)} days ago`; };
const gb = b => b >= 1e9 ? `${(b/1e9).toFixed(1)} GB` : `${Math.round((b||0)/1e6)} MB`;
const statusPill = st => !st ? `<span class="pill">never synced</span>`

          <div class="sub" style="margin:0">${meta(ip.metadata) || "Unknown model"}</div></div>
        <div style="text-align:right">${live ? `<span class="pill ok">● connected · ${esc(st)}</span><br>` : ""}
          <span class="sub" style="margin:0;font-size:12px">Last sync ${ago(ip.last_sync)}</span> ${statusPill(ip.last_status)}</div>
      </div>
      <div class="sub" style="margin:10px 0 0" data-sum>Will receive <b>${sum.albums}</b> albums · ${sum.tracks} tracks · ${gb(sum.bytes)} · ${sum.playlists} playlists</div>
      <form class="settings">
        <div><b>Name</b><input class="text" name="name" value="${esc(ip.name)}" style="max-width:300px"></div>
        <div><b>Folder layout on the iPod</b><div class="opts">
          <label><input type="radio" name="layout" value="genre" ${ip.layout==='genre'?'checked':''}> Like the server: 0_GENRE / Artist / Album</label>
          <label><input type="radio" name="layout" value="flat" ${ip.layout==='flat'?'checked':''}> Flat: Artist / Album</label></div></div>
        <div><b>Music</b><div class="opts">
          <label><input type="radio" name="music" value="all" ${s.music==='all'?'checked':''}> Whole library</label>
          <label><input type="radio" name="music" value="selected" ${s.music==='selected'?'checked':''}> Only these genres, plus albums in synced playlists:</label></div>
          <div class="opts" data-genres style="margin-top:6px;${s.music==='selected'?'':'opacity:.45'}">${data.genres.map(g=>`<label><input type="checkbox" name="genre" value="${esc(g.rel_dir)}" ${s.genres.includes(g.rel_dir)?'checked':''} ${s.music==='selected'?'':'disabled'}> ${esc(g.genre)}</label>`).join("")}</div></div>
        <div><b>Playlists</b><div class="opts">
          <label><input type="checkbox" name="own" ${s.own_playlists?'checked':''}> All my playlists (new ones included)</label></div>
          <div class="opts" style="margin-top:6px">${pick(MINE, true)}${pick(others, false)}</div></div>
        <div><b>Scrobbling</b><div class="opts">
          <label><input type="checkbox" name="scrobble" ${s.scrobble?'checked':''} ${ME.lastfm_user?'':'disabled'}>
          ${ME.lastfm_user ? `Scrobble plays to last.fm/${esc(ME.lastfm_user)}` : `Connect Last.fm on <a data-link href="/user/${encodeURIComponent(ME.username)}">your profile</a> to scrobble`}</label></div></div>
        <div class="bar" style="display:flex;gap:8px"><button class="btn primary">Save</button>
          <button class="btn danger" type="button" data-unlink>Unlink</button></div>
      </form>
    </div>`;
  };
  $("#panel").innerHTML = `<h2>My iPod</h2>
    <div class="sub">Plug an iPod into the server to sync it. These settings are saved here and used every time it connects.</div>
    ${unclaimed}
    ${data.ipods.map(card).join("")}
    ${!data.ipods.length && !data.unclaimed.length ? `<div class="empty">No iPods yet. Plug yours into the server — it'll appear here to link.</div>` : ""}`;

  document.querySelectorAll("[data-link-sig]").forEach(f=>f.onsubmit = async e=>{
    e.preventDefault();
    try { await post("/api/ipods", {signature: f.dataset.linkSig, name: f.name.value});
          toast("Linked — it'll sync with these settings next time it connects"); loadUsers(); renderIpods(); }
    catch(err){ toast(err.message); }
  });
  document.querySelectorAll("[data-ipod]").forEach(c=>{
    const id = +c.dataset.ipod, f = c.querySelector("form");
    const syncGenres = ()=>{ const sel = f.music.value === "selected";
      c.querySelector("[data-genres]").style.opacity = sel ? 1 : .45;
      f.querySelectorAll("[name=genre]").forEach(x=>x.disabled = !sel); };
    const syncOwn = ()=>MINE.forEach(p=>{ const x = f.querySelector(`[name=pl][value="${p.id}"]`);
      if(x){ x.disabled = f.own.checked; if(f.own.checked) x.checked = true; } });
    f.querySelectorAll("[name=music]").forEach(r=>r.onchange = syncGenres);
    f.own.onchange = syncOwn;
    f.onsubmit = async e=>{
      e.preventDefault();
      const checked = n => [...f.querySelectorAll(`[name=${n}]:checked`)];
      const body = {name: f.name.value, layout: f.layout.value, sync: {
        music: f.music.value, genres: checked("genre").map(x=>x.value), own_playlists: f.own.checked,
        playlists: checked("pl").filter(x=>!x.disabled).map(x=>+x.value), scrobble: f.scrobble.checked}};
      try {
        const r = await api(`/api/ipods/${id}`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
        c.querySelector("[data-sum]").innerHTML = `Will receive <b>${r.summary.albums}</b> albums · ${r.summary.tracks} tracks · ${gb(r.summary.bytes)} · ${r.summary.playlists} playlists`;
        toast("Saved — applies next time it connects");
      } catch(err){ toast(err.message); }
    };
    c.querySelector("[data-unlink]").onclick = async ()=>{
      if(!confirm("Unlink this iPod? It stops syncing until someone links it again.")) return;
      await post(`/api/ipods/${id}`, null, "DELETE"); loadUsers(); renderIpods(); };
  });
}

// ── Activity: the logged-in user's iPod + playlist history ──────────────────
async function renderActivity(){
  setTitle("Activity");
  if(!ME) return loginPrompt("see your iPod activity");
  const nav = NAV;
  const {activity} = await api("/api/activity");
  if(nav !== NAV) return;
  const icon = {sync:"🔄", connect:"🔌", link:"🔗", playlist:"🎶"};
  $("#panel").innerHTML = `<h2>Activity</h2>
    ${activity.length ? `<div class="list">${activity.map(a=>`<div class="row">
      <div class="num" style="width:auto">${icon[a.kind]||"•"}</div>
      <div class="main">${esc(a.message)}${a.detail?.status && a.detail.status!=="ok" ? ` ${statusPill(a.detail.status)}` : ""}</div>
      <small class="r-genre">${new Date(a.ts*1000).toLocaleString()}</small></div>`).join("")}</div>`
    : `<div class="empty">Nothing yet — link an iPod on the My iPod tab and plug it in.</div>`}`;
}

// ── Router: real URLs, Spotify-style prefixes ───────────────────────────────
//   /library[/<folder path>]   /artists  /artist/<name>   /albums  /album/<folder path>
//   /playlists  /playlist/<id>   /activity  /ipod
function setTitle(t){ document.title = t ? `${t} · Aquaria` : "Aquaria Music Manager"; }

// "← Parent": step back through history when we got here in-app, else open the parent URL.
function backLink(href, label){
  return `<a class="crumb" data-link data-back href="${esc(href)}">← ${esc(label)}</a>`;
}

function notFound(msg, href, label){
  $("#panel").innerHTML = `${backLink(href, label)}<div class="empty">${esc(msg)}</div>`;
  setTitle("Not found");
}

function go(url, replace=false){
  if(url === location.pathname) return route();
  history[replace ? "replaceState" : "pushState"]({inapp:true}, "", url);
  window.scrollTo(0, 0);
  route();
}

document.addEventListener("click", e=>{
  const a = e.target.closest("a[data-link]");
  if(!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  if(a.hasAttribute("data-back") && history.state?.inapp) history.back();
  else go(a.getAttribute("href"));
});
window.addEventListener("popstate", route);

const TAB_OF = {library:"library", artists:"library", albums:"library", artist:"library",
                album:"library", playlists:"playlists", playlist:"playlists",
                activity:"activity", ipod:"ipod"};
// (user / users / login / signup pages don't belong to a tab)

function route(){
  NAV++;
  const [head, ...rest] = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  if(!head) return go("/library", true);
  const tab = TAB_OF[head];
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===tab));
  closePop();
  switch(head){
    case "library":   VIEW = "genre"; PATH = rest; return renderLibrary();
    case "artists":   VIEW = "artist"; return renderLibrary();
    case "albums":    VIEW = "all_albums"; return renderLibrary();
    case "artist":    return renderArtistByName(rest.join("/"));
    case "album":     return renderAlbum(rest.join("/"));
    case "playlists": return renderPlaylists();
    case "playlist":  return renderPlaylist(+rest[0]);
    case "activity":  return renderActivity();
    case "ipod":      return renderIpods();
    case "user":      return renderUser(rest.join("/"));
    case "users":     return renderUsers();
    case "login":     return renderAuth("login");
    case "signup":    return renderAuth("signup");
    default:          return notFound("Page not found", "/library", "Library");
  }
}

// ── currently-adding search ─────────────────────────────────────────────────
$("#fabBtn").onclick=()=>{ $("#fab").classList.toggle("open"); if($("#fab").classList.contains("open")) $("#q").focus(); };
$("#editSel").onchange=e=>{ EDITING = e.target.value ? +e.target.value : null; loadPlaylists(); };
let timer, RES = null;
$("#q").oninput=e=>{
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    const q=e.target.value.trim();
    if(!q){$("#res").innerHTML="";return;}
    RES = await api("/api/search?q="+encodeURIComponent(q));
    const verb = EDITING ? "＋" : "";
    const sec=(label,arr,fmt)=>arr.length?`<div class="grp">${label}</div>`+arr.map(fmt).join(""):"";
    $("#res").innerHTML =
      sec("Albums",RES.albums.slice(0,8),(a,i)=>`<div class="item" data-sa="${i}"><span class="main">💿 ${esc(a.artist)} — ${esc(a.album)}${yr(a.year)}</span>${verb}</div>`)+
      sec("Tracks",RES.tracks,(t,i)=>`<div class="item" data-st="${i}"><span class="main">🎵 ${esc(t.title)} <small>· ${esc(t.artist)}</small></span>${verb||'▶'}</div>`);
    if(!RES.tracks.length) $("#res").innerHTML = `<div class="item"><small>No matches</small></div>`;
  },180);
};
$("#res").onclick = e=>{
  const it = e.target.closest(".item"); if(!it || !RES) return;
  if(it.dataset.sa!==undefined){
    const a = RES.albums[+it.dataset.sa];
    if(EDITING) addTo(EDITING, {folder:a.folder}); else go("/album/"+enc(a.folder));
  } else if(it.dataset.st!==undefined){
    const t = RES.tracks[+it.dataset.st];
    EDITING ? addTo(EDITING, {rel_paths:[t.rel_path]}) : play([t], 0);
  }
  if(EDITING && location.pathname === "/playlist/"+EDITING)
    setTimeout(()=>renderPlaylist(EDITING), 150);
};

(async ()=>{
  await loadMe();
  loadUsers(); loadPlaylists();
  const s = await loadStats();
  route();
  // First boot: the server indexes in the background — poll until tracks appear.
  if(!s.tracks){
    const iv = setInterval(async()=>{ const s2 = await loadStats();
      if(s2.tracks){ clearInterval(iv); loadUsers(); loadPlaylists(); route(); } }, 3000);
  }
})();
</script>
