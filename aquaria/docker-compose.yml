# Aquaria — deployed on the NUC as /home/jimin/docker/aquaria/docker-compose.yml
# (homelab conventions: one dir per service, 0.0.0.0 ports, external `proxy` network,
# always-on, no Caddy for internal services).
#
# The image is built from a clone of this repo (default /home/jimin/code/ipod-sync).
# Update: git -C /home/jimin/code/ipod-sync pull && docker compose up -d --build
services:
  aquaria:
    build:
      context: ${IPOD_SYNC_SRC:-/home/jimin/code/ipod-sync}/aquaria
    image: aquaria:latest
    container_name: aquaria
    restart: unless-stopped
    # jimin — the FLAC tree is owner-only readable, and playlists written here must stay
    # editable by the host-side ipod-sync.sh / music-watcher (which run as jimin).
    user: "1000:1000"
    environment:
      AQUARIA_DEFAULT_USER: ${AQUARIA_DEFAULT_USER:-jimin}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./data:/data                                                    # SQLite index
      - ${MUSIC_DIR:-/mnt/data/media/music/FLAC}:/mnt/data/media/music/FLAC:ro
      - ${PLAYLIST_DIR:-/mnt/data/media/music/Playlists}:/mnt/data/media/music/Playlists
    ports:
      - "0.0.0.0:8337:8337"   # Tailscale 100.94.158.95:8337, LAN 192.168.1.65:8337
    networks:
      - proxy
    # iPod access (libgpod/udev) lands in a later iteration; it needs USB passthrough:
    #   devices: ["/dev/bus/usb:/dev/bus/usb"]

networks:
  proxy:
    external: true
